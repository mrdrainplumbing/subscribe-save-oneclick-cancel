# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: build

on:
    push:
        branches: [main]
        tags: ["v*"]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v5
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: "pnpm"

            - run: pnpm install
            - run: pnpm run lint
            - run: pnpm run build-zip
            - name: "Upload Artifacts"
              uses: actions/upload-artifact@v4
              with:
                  path: |
                      chrome-subscribe-save-oneclick-cancel.zip
                      firefox-subscribe-save-oneclick-cancel.zip
            - name: "Create GitHub Release"
              if: startsWith(github.ref, 'refs/tags/v')
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
            - name: "Upload Release ZIPs"
              if: startsWith(github.ref, 'refs/tags/v')
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release upload "$GITHUB_REF_NAME" chrome-subscribe-save-oneclick-cancel.zip firefox-subscribe-save-oneclick-cancel.zip --clobber
