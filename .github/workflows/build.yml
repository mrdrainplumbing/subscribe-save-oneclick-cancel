# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: build

on:
    workflow_dispatch:
    push:
        branches: [main]
        tags: ["v*"]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v5
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: "pnpm"

            - run: pnpm install
            - run: pnpm run lint
            - run: pnpm run build-zip
            - name: "Sign Firefox Extension"
              if: startsWith(github.ref, 'refs/tags/v')
              env:
                  AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
                  AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
              run: |
                  git archive --format=zip --output dist/firefox-source.zip HEAD
                  pnpm exec web-ext sign \
                      --source-dir dist/firefox \
                      --artifacts-dir dist/signed-firefox \
                      --channel unlisted \
                      --api-key "$AMO_JWT_ISSUER" \
                      --api-secret "$AMO_JWT_SECRET" \
                      --upload-source-code dist/firefox-source.zip \
                      --approval-timeout 900000 \
                      --no-input
                  mv dist/signed-firefox/*.xpi firefox-subscribe-save-oneclick-cancel.xpi
            - name: "Upload Artifacts"
              uses: actions/upload-artifact@v4
              with:
                  path: |
                      chrome-subscribe-save-oneclick-cancel.zip
                      firefox-subscribe-save-oneclick-cancel.zip
                      firefox-subscribe-save-oneclick-cancel.xpi
            - name: "Create GitHub Release"
              if: startsWith(github.ref, 'refs/tags/v')
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
            - name: "Upload Release Packages"
              if: startsWith(github.ref, 'refs/tags/v')
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release upload "$GITHUB_REF_NAME" chrome-subscribe-save-oneclick-cancel.zip firefox-subscribe-save-oneclick-cancel.xpi --clobber
