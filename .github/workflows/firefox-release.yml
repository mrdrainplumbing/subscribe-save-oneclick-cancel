name: Firefox release

on:
    workflow_dispatch:
    push:
        tags: ['firefox-v*']

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: 'pnpm'

            - run: pnpm install --frozen-lockfile
            - name: 'Set Firefox release metadata'
              run: |
                  if [[ "$GITHUB_REF" == refs/tags/firefox-v* ]]; then
                      version="${GITHUB_REF_NAME#firefox-v}"
                  else
                      version="2026.9.10.1"
                  fi
                  echo "EXTENSION_VERSION=$version" >> "$GITHUB_ENV"
                  echo "FIREFOX_ZIP=subscribe-save-oneclick-cancel-firefox-$version.zip" >> "$GITHUB_ENV"
                  echo "FIREFOX_XPI=subscribe-save-oneclick-cancel-firefox-$version.xpi" >> "$GITHUB_ENV"
            - name: 'Build Firefox package'
              run: |
                  pnpm exec vite build --mode firefox
                  cd dist/firefox
                  zip -r "../../$FIREFOX_ZIP" .
            - name: 'Sign Firefox extension'
              if: startsWith(github.ref, 'refs/tags/firefox-v')
              env:
                  AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
                  AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
              run: |
                  git archive --format=zip --output dist/firefox-source.zip HEAD
                  pnpm dlx web-ext@10.5.0 sign \
                      --source-dir dist/firefox \
                      --artifacts-dir dist/signed-firefox \
                      --channel unlisted \
                      --api-key "$AMO_JWT_ISSUER" \
                      --api-secret "$AMO_JWT_SECRET" \
                      --upload-source-code dist/firefox-source.zip \
                      --approval-timeout 900000 \
                      --no-input
                  mv dist/signed-firefox/*.xpi "$FIREFOX_XPI"
            - name: 'Upload Firefox build artifacts'
              uses: actions/upload-artifact@v7
              with:
                  path: |
                      ${{ env.FIREFOX_ZIP }}
                      ${{ env.FIREFOX_XPI }}
            - name: 'Create GitHub release'
              if: startsWith(github.ref, 'refs/tags/firefox-v')
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Firefox community build $EXTENSION_VERSION"
            - name: 'Upload release packages'
              if: startsWith(github.ref, 'refs/tags/firefox-v')
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release upload "$GITHUB_REF_NAME" "$FIREFOX_XPI" --clobber
